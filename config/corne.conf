# Increase transmission strength.
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable the nice!view on the display header -- a Sharp LS011B7DH03
# memory-in-pixel LCD, 160x68, SPI. NOT e-ink despite the marketing:
# it is reflective and bistable-ish, so it refreshes instantly with no
# ghosting, but loses the image without power. The panel selection lives
# in build.yaml (nice_view_adapter + nice_view shields), not here.
# https://zmk.dev/docs/config/displays
CONFIG_ZMK_DISPLAY=y

# The nice_view shield selects CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM and
# ships its own screen, so every option that configured the BUILT_IN screen
# is gone. Do not re-add them:
#   ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN        conflicts with the custom screen
#   ZMK_WIDGET_WPM_STATUS                     built-in screen only
#   ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE built-in screen only; the
#                                             nice!view screen prints the
#                                             number itself
#   ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26   sized the built-in screen's font
#   LV_FONT_DEFAULT_MONTSERRAT_26             ditto
#
# Left =n. The nice!view pushes a 1360-byte frame over SPI, which is a
# bigger unit of work than the OLED's, so if typing ever stutters or the
# screen lags, flipping this to =y moves the refresh off the system work
# queue. Unchanged for now to keep this commit to one variable.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

# RGB underglow. Off by default -- toggle and adjust at runtime from the
# STG layer. Start values only apply on a fresh settings partition; once
# adjusted, ZMK persists your choice and these are ignored.
# https://zmk.dev/docs/config/underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Don't let the RGB toggle cut the external power rail -- the display is fed
# from that same switched VCC, so it would go dark whenever RGB is off.
# Still true of the nice!view: same header, same rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Power management.
# https://zmk.dev/docs/config/power
#
# The 5 s idle timeout was sized for the OLED, which drew ~10mA lit vs ~7uA
# asleep -- roughly 95% of the power budget, so blanking it fast was the
# single biggest battery win. THAT PREMISE IS GONE: the nice!view is a
# reflective memory LCD in the tens-of-microamps range, so keeping it lit
# costs almost nothing and 5 s is now needlessly aggressive -- the screen
# blanks while you are still looking at it.
#
# Deliberately NOT raised in this commit, so the display swap can be
# verified on its own. Raising it (30000-60000) is the obvious follow-up.
CONFIG_ZMK_IDLE_TIMEOUT=5000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Bluetooth
# https://zmk.dev/docs/config/system#bluetooth
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Debug
# https://zmk.dev/docs/config/system#logging
CONFIG_ZMK_USB_LOGGING=n

# Battery
# https://zmk.dev/docs/config/battery#peripheral-battery-monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Key Chatter
# https://zmk.dev/docs/features/debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
