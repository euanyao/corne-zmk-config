# Increase transmission strength.
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable the nice!view on the display header -- a Sharp LS011B7DH03
# memory-in-pixel LCD, 160x68, SPI. NOT e-ink despite the marketing:
# it is reflective and bistable-ish, so it refreshes instantly with no
# ghosting, but loses the image without power. The panel selection lives
# in build.yaml (nice_view_adapter + nice_epaper shields), not here.
# https://zmk.dev/docs/config/displays
CONFIG_ZMK_DISPLAY=y

# The status screen comes from the zmk-nice-oled module (config/west.yml),
# via its `nice_epaper` shield -- a vertical widget layout, not ZMK's
# built-in nice!view screen. The module's Kconfig.defconfig already defaults
# this choice to CUSTOM; set explicitly because the module's README asks for
# it and because it documents intent at the point of use.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Every option that configured the BUILT_IN screen is gone. Do not re-add:
#   ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN        conflicts with the custom screen
#   ZMK_WIDGET_WPM_STATUS                     built-in screen only
#   ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE built-in screen only; the
#                                             custom screen prints the
#                                             number itself
#   ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26   sized the built-in screen's font
#   LV_FONT_DEFAULT_MONTSERRAT_26             ditto
#
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED IS DELIBERATELY ABSENT. It used to
# be pinned =n here. The module defaults the ZMK_DISPLAY_WORK_QUEUE choice to
# DEDICATED and sizes ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE (2560, or 3072
# with RAW HID) to match, so forcing =n both fights its default and leaves
# that stack sizing describing a thread that no longer exists. Let the module
# win. The module also owns LV_Z_VDB_SIZE (100), LV_DPI_DEF (161),
# LV_Z_BITS_PER_PIXEL (1) and LV_COLOR_DEPTH_1 for this panel -- do not set
# those here either.

# Modifier indicators: a ROW along the panel's long edge, replacing the
# default 2x2 box that shipped mostly off-panel.
#
# COORDINATE SYSTEM FIRST -- it explains everything below and is not
# obvious. [verified -- module source, 2026-09-07]
# The module draws into a content region CANVAS_WIDTH x CANVAS_HEIGHT =
# 68 x 160 (narrow and tall), then rotates 90 degrees onto the 160x68 panel
# (widgets/util.c rotate_canvas, pivot 80,80). Therefore:
#
#     canvas X  <-> the panel's 68px axis    (anything x >= 68 is invisible)
#     canvas Y  <-> the panel's 160px axis
#
# HOR AND VER ARE NAMED IN CANVAS SPACE, SO THE ROTATION SWAPS THEM.
# screen.c draw_mods_status steps HOR along x and VER along y, so it is
# FIXED_VER that renders as a row across the panel's LONG edge. That also
# decides how big the icons can ever be -- 4 icons + 3 gaps of 2px:
#
#     FIXED_HOR  4S+6 <= 68   ->  max icon 15px   (a 1px gain; a dead end)
#     FIXED_VER  4S+6 <= 160  ->  max icon 38px
#     FIXED_BOX  2S+2 <= 68   ->  max icon 33px
#
# Hence VER: it is the row we want AND the only layout with room to grow.
#
# STILL 14px FOR NOW. Every modifier asset in the module is 14x14
# (modifiers_sym.c / modifiers_270.c, .header.w = .header.h = 14) and
# img_size is a hardcoded `const int` in screen.c, not a Kconfig -- there
# is no size or scale option. Bigger icons require forking the module.
# Deliberately deferred until this lands on hardware and confirms the axis
# mapping above, so custom art is not drawn against an unverified guess.
#
# VER IGNORES BOTH POSITION VARIABLES. base_y is a hardcoded 62 and
# ALIGN_CENTER computes base_x = (68 - img_size) / 2 = 27; only ALIGN_LEFT
# reads MODIFIERS_CUSTOM_X. So the row sits at canvas x 27..41, y 62..124.
# ALIGN_CENTER is already the choice default -- set explicitly to document
# intent. The old MODIFIERS_CUSTOM_X=38 is therefore INERT and removed; it
# was the max legal value for BOX (68 - 30), needed only because the
# shipped X=62 put one column at x 62..75 (clipped at 67) and the other at
# 78..91 (entirely off-panel). Restore it if you ever go back to BOX.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_VER=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_VER_ALIGN_CENTER=y

# Traps worth keeping, all [verified -- module source]:
#
#   draw_mods_status has TWO halves with DIFFERENT dimensions -- a SYMBOL
#   half (14x14 icons) and a LETTER half (`#else -- MODO LETRAS`, 12x14
#   boxes), each with its own full VER/HOR/BOX variants. Reading the wrong
#   half yields a wrong answer that still looks plausible; it already cost
#   one bad commit. We build SYMBOL (the default).
#
#   modifiers.c's symbol path is DEAD CODE -- gated on
#   ..._FIXED_SYMBOL_VERTICAL, which is referenced in the source but
#   defined in NO Kconfig, so it can never be enabled. Same for
#   ..._FIXED_ONE_LINE_VERTICAL. Never assign either: ZMK CI aborts on
#   assignment to an undefined symbol. The live code is in screen.c.
#
#   THE README DISAGREES WITH THE CODE on positions -- trust the code. Its
#   table claims epaper MODIFIERS_CUSTOM_X=2 / Y=110 and PROFILE_BIG
#   default n, while Kconfig has 62 / 62 and `default y if NICE_EPAPER_ON`.
#   The README's numbers are self-consistent only with PROFILE_BIG=n; with
#   it on, Y=110 runs the box (y 110..139) through the profile icons
#   (y 129..141). The README's *modifier option list* is accurate though --
#   all 16 entries exist in Kconfig.

# Right half: battery status instead of the cat animation.
#
# The peripheral screen ALREADY draws output status and battery
# unconditionally (screen_peripheral.c draw_canvas: draw_background,
# draw_output_status, draw_battery_status). The animation only fills the
# large remaining area, so this is the one place there was a choice.
#
# SMART_BATTERY *replaces* the animation rather than adding to it --
# screen_peripheral.c:151 draws it `#if !SMART_BATTERY`. So this also drops
# the 960ms cat redraw, which is worth something on a battery-powered
# peripheral driving a memory LCD.
#
# Referenced only by battery.c / animation.c / screen_peripheral.c and never
# by screen.c, so it is genuinely peripheral-only and safe to set in the
# shared conf -- the central ignores it. [verified -- module source]
#
# With no RAW HID planned, the time / weather / volume / layout / Spotify
# widgets are all unavailable (they need the zmk-hid-host companion app), so
# this is the only functional option the module offers for that area. The
# alternatives are peripheral WPM (pulls in ZMK_WPM: extra keystroke
# processing and frequent redraws) or a static image (lowest power, but not
# functional).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y

# RGB underglow. Off by default -- toggle and adjust at runtime from the
# STG layer. Start values only apply on a fresh settings partition; once
# adjusted, ZMK persists your choice and these are ignored.
# https://zmk.dev/docs/config/underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# REQUIRED BY THE v0.3.0 PIN. Zephyr 4.1 (main) auto-selects the WS2812 SPI
# driver from DTS; Zephyr 3.5 (v0.3.0) does not, and without this the
# underglow silently builds dead. v0.3.0's own corne shield template pairs
# the two symbols. Drop it if and only if the pin is removed -- 'menuconfig
# WS2812_STRIP' no longer exists on 4.1, and ZMK CI aborts on assignment to
# an undefined symbol. [verified -- Kconfig.ws2812 @ v3.5.0+zmk-fixes]
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Don't let the RGB toggle cut the external power rail -- the display is fed
# from that same switched VCC, so it would go dark whenever RGB is off.
# Still true of the nice!view: same header, same rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Power management.
# https://zmk.dev/docs/config/power
#
# The old 5 s idle timeout was sized for the OLED, which drew ~10mA lit vs
# ~7uA asleep -- roughly 95% of the power budget, so blanking it fast was
# the single biggest battery win. THAT PREMISE IS GONE: the nice!view is a
# reflective memory LCD in the tens-of-microamps range, so keeping it lit
# costs almost nothing.
#
# IDLE_TIMEOUT is therefore set EQUAL to IDLE_SLEEP_TIMEOUT: there is no
# longer any reason for an intermediate blanked-but-awake state, so the
# display stays readable for as long as the board is awake and deep sleep
# takes it from there.
#
# CAUTION -- IDLE_TIMEOUT is not display-only. ZMK's idle state also drives
# RGB_UNDERGLOW_AUTO_OFF_IDLE below, so 27 LEDs per half now stay lit for
# the full hour instead of switching off after 5 s. Underglow starts off
# (ON_START=n) so this only bites once it is toggled on from the STG layer,
# but RGB dwarfs the display in current draw. If underglow becomes
# something used routinely rather than occasionally, decouple the two by
# dropping IDLE_TIMEOUT back below the sleep timeout and accepting that the
# screen blanks first.
CONFIG_ZMK_IDLE_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Bluetooth
# https://zmk.dev/docs/config/system#bluetooth
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Debug
# https://zmk.dev/docs/config/system#logging
CONFIG_ZMK_USB_LOGGING=n

# Battery
# https://zmk.dev/docs/config/battery#peripheral-battery-monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Key Chatter
# https://zmk.dev/docs/features/debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
