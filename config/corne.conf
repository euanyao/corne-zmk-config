# Increase transmission strength.
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable the nice!view on the display header -- a Sharp LS011B7DH03
# memory-in-pixel LCD, 160x68, SPI. NOT e-ink despite the marketing:
# it is reflective and bistable-ish, so it refreshes instantly with no
# ghosting, but loses the image without power. The panel selection lives
# in build.yaml (nice_view_adapter + nice_epaper shields), not here.
# https://zmk.dev/docs/config/displays
CONFIG_ZMK_DISPLAY=y

# The status screen comes from the zmk-nice-oled module (config/west.yml),
# via its `nice_epaper` shield -- a vertical widget layout, not ZMK's
# built-in nice!view screen. The module's Kconfig.defconfig already defaults
# this choice to CUSTOM; set explicitly because the module's README asks for
# it and because it documents intent at the point of use.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Every option that configured the BUILT_IN screen is gone. Do not re-add:
#   ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN        conflicts with the custom screen
#   ZMK_WIDGET_WPM_STATUS                     built-in screen only
#   ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE built-in screen only; the
#                                             custom screen prints the
#                                             number itself
#   ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26   sized the built-in screen's font
#   LV_FONT_DEFAULT_MONTSERRAT_26             ditto
#
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED IS DELIBERATELY ABSENT. It used to
# be pinned =n here. The module defaults the ZMK_DISPLAY_WORK_QUEUE choice to
# DEDICATED and sizes ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE (2560, or 3072
# with RAW HID) to match, so forcing =n both fights its default and leaves
# that stack sizing describing a thread that no longer exists. Let the module
# win. The module also owns LV_Z_VDB_SIZE (100), LV_DPI_DEF (161),
# LV_Z_BITS_PER_PIXEL (1) and LV_COLOR_DEPTH_1 for this panel -- do not set
# those here either.

# RGB underglow. Off by default -- toggle and adjust at runtime from the
# STG layer. Start values only apply on a fresh settings partition; once
# adjusted, ZMK persists your choice and these are ignored.
# https://zmk.dev/docs/config/underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# REQUIRED BY THE v0.3.0 PIN. Zephyr 4.1 (main) auto-selects the WS2812 SPI
# driver from DTS; Zephyr 3.5 (v0.3.0) does not, and without this the
# underglow silently builds dead. v0.3.0's own corne shield template pairs
# the two symbols. Drop it if and only if the pin is removed -- 'menuconfig
# WS2812_STRIP' no longer exists on 4.1, and ZMK CI aborts on assignment to
# an undefined symbol. [verified -- Kconfig.ws2812 @ v3.5.0+zmk-fixes]
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Don't let the RGB toggle cut the external power rail -- the display is fed
# from that same switched VCC, so it would go dark whenever RGB is off.
# Still true of the nice!view: same header, same rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Power management.
# https://zmk.dev/docs/config/power
#
# The old 5 s idle timeout was sized for the OLED, which drew ~10mA lit vs
# ~7uA asleep -- roughly 95% of the power budget, so blanking it fast was
# the single biggest battery win. THAT PREMISE IS GONE: the nice!view is a
# reflective memory LCD in the tens-of-microamps range, so keeping it lit
# costs almost nothing.
#
# IDLE_TIMEOUT is therefore set EQUAL to IDLE_SLEEP_TIMEOUT: there is no
# longer any reason for an intermediate blanked-but-awake state, so the
# display stays readable for as long as the board is awake and deep sleep
# takes it from there.
#
# CAUTION -- IDLE_TIMEOUT is not display-only. ZMK's idle state also drives
# RGB_UNDERGLOW_AUTO_OFF_IDLE below, so 27 LEDs per half now stay lit for
# the full hour instead of switching off after 5 s. Underglow starts off
# (ON_START=n) so this only bites once it is toggled on from the STG layer,
# but RGB dwarfs the display in current draw. If underglow becomes
# something used routinely rather than occasionally, decouple the two by
# dropping IDLE_TIMEOUT back below the sleep timeout and accepting that the
# screen blanks first.
CONFIG_ZMK_IDLE_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Bluetooth
# https://zmk.dev/docs/config/system#bluetooth
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Debug
# https://zmk.dev/docs/config/system#logging
CONFIG_ZMK_USB_LOGGING=n

# Battery
# https://zmk.dev/docs/config/battery#peripheral-battery-monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Key Chatter
# https://zmk.dev/docs/features/debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
